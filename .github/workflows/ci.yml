name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tooling
        run: make setup
      - name: Ruff
        run: make lint
      - name: Pre-commit configuration
        run: .venv/bin/pre-commit validate-config
      - name: Compose configuration
        run: make config-check
      - name: Offline tests (includes runtime image build)
        run: make test
      - name: PostgreSQL and MinIO integration tests
        run: make test-integration
      - name: Cleanup test stack
        if: always()
        run: docker compose --env-file /dev/null -p weather-tests -f docker-compose.test.yml down --volumes --remove-orphans
