# Local hooks use the exact Ruff version installed by `make setup`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^(scripts|dags|tests)/
      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, pyi]
        files: ^(scripts|dags|tests)/
